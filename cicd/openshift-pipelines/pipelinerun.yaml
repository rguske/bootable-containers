---
# Example PipelineRun for bootc-build-deploy pipeline
# Use `oc create`, not `oc apply`: generateName is not valid with apply.
# Replace YOUR_ORG and YOUR_USERNAME before creating the run.
# YOUR_ORG is a placeholder, not a cluster variable. Leave it as-is and
# git-clone fails: fatal: could not read Username for 'https://github.com'

apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: bootc-build-deploy-run-
  namespace: bootable-containers-cicd
  labels:
    app.kubernetes.io/name: bootc-pipeline
spec:
  pipelineRef:
    name: bootc-build-deploy
  
  params:
    - name: git-url
      value: "https://github.com/rguske/bootable-containers.git"
    - name: git-revision
      value: "main"
    - name: image-name
      value: "bootc-webserver"
    - name: image-tag
      value: ""  # empty = UTC YYYYMMDD-HHMM at run time; or set e.g. 20260827-1505
    - name: registry-url
      value: "quay.io"
    - name: registry-namespace
      value: "rguske"
    - name: target-namespace
      value: "bootable-containers-demo"
  
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    
    - name: dockerconfig
      secret:
        secretName: registry-credentials

  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      securityContext:
        fsGroup: 65532
