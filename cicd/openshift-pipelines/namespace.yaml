---
apiVersion: v1
kind: Namespace
metadata:
  name: bootable-containers-cicd
  labels:
    app.kubernetes.io/name: bootable-containers
    app.kubernetes.io/component: cicd
---
# ServiceAccount for pipeline execution
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: bootable-containers-cicd
---
# Allow pipeline to create resources in target namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootc-pipeline-admin
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: bootable-containers-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
# SCC for privileged builds (required for bootc-image-builder)
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: bootc-builder-scc
allowPrivilegedContainer: true
allowHostDirVolumePlugin: true
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:bootable-containers-cicd:pipeline
volumes:
  - '*'
