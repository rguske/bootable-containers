---
# OpenShift Pipelines (Tekton) for Bootable Containers
# Requires: OpenShift Pipelines Operator installed.
# Standard tasks (git-clone, buildah, openshift-client) are referenced with
# the cluster resolver from the openshift-pipelines namespace. ClusterTask
# is not valid on current operator versions.

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bootc-build-deploy
  namespace: bootable-containers-cicd
  labels:
    app.kubernetes.io/name: bootc-pipeline
spec:
  description: |
    Build a bootable container, convert to QCOW2, and deploy to OpenShift Virtualization
  
  params:
    - name: git-url
      type: string
      description: Git repository URL
      default: "https://github.com/rguske/bootable-containers.git"
    
    - name: git-revision
      type: string
      description: Git revision to build
      default: "main"
    
    - name: image-name
      type: string
      description: Name of the image to build
      default: "bootc-webserver"
    
    - name: image-tag
      type: string
      description: Image tag. Leave empty to generate UTC YYYYMMDD-HHMM at run time (for example 20260827-1505). Do not use latest.
      default: ""
    
    - name: registry-url
      type: string
      description: Container registry URL
      default: "quay.io"
    
    - name: registry-namespace
      type: string
      description: Registry namespace/username
    
    - name: containerfile-path
      type: string
      description: Path to Containerfile
      default: "demos/webserver/Containerfile"
    
    - name: context-path
      type: string
      description: Build context path
      default: "demos/webserver"
    
    - name: target-namespace
      type: string
      description: Namespace to deploy VM
      default: "bootable-containers-demo"

  workspaces:
    - name: source
      description: Workspace for source code
    - name: dockerconfig
      description: Docker config for registry auth

  tasks:
    # Task 1: Resolve image tag (UTC YYYYMMDD-HHMM unless a tag was passed in)
    - name: set-image-tag
      params:
        - name: image-tag
          value: $(params.image-tag)
      taskSpec:
        params:
          - name: image-tag
            type: string
        results:
          - name: tag
            description: Image tag used for this run
        steps:
          - name: generate
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: IMAGE_TAG
                value: $(params.image-tag)
            script: |
              #!/bin/sh
              set -eu
              TAG="${IMAGE_TAG}"
              if [ -z "${TAG}" ]; then
                TAG="$(date -u +%Y%m%d-%H%M)"
              fi
              printf '%s' "${TAG}" > "$(results.tag.path)"
              echo "Using image tag: ${TAG}"

    # Task 2: Clone the repository
    # Using inline taskSpec instead of cluster git-clone to avoid git-init
    # credential helper issues with public repos
    - name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source
      taskSpec:
        params:
          - name: url
            type: string
          - name: revision
            type: string
            default: main
        results:
          - name: COMMIT
            description: The commit SHA that was cloned
        workspaces:
          - name: output
        steps:
          - name: clone
            image: alpine/git:latest
            env:
              - name: GIT_TERMINAL_PROMPT
                value: "0"
            script: |
              #!/bin/sh
              set -eu
              CHECKOUT_DIR="$(workspaces.output.path)"
              echo "Cleaning workspace ${CHECKOUT_DIR}..."
              rm -rf "${CHECKOUT_DIR:?}"/* "${CHECKOUT_DIR}"/.[!.]* 2>/dev/null || true
              cd "${CHECKOUT_DIR}"
              echo "Cloning $(params.url) at $(params.revision)..."
              git clone --depth 1 --branch "$(params.revision)" "$(params.url)" .
              COMMIT=$(git rev-parse HEAD)
              echo "Cloned commit: ${COMMIT}"
              printf '%s' "${COMMIT}" > "$(results.COMMIT.path)"

    # Task 3: Build the bootc container image (privileged; cluster buildah is not enough)
    - name: build-bootc-image
      taskRef:
        name: buildah-bootc
        kind: Task
      runAfter:
        - git-clone
        - set-image-tag
      params:
        - name: IMAGE
          value: "$(params.registry-url)/$(params.registry-namespace)/$(params.image-name):$(tasks.set-image-tag.results.tag)"
        - name: DOCKERFILE
          value: $(params.containerfile-path)
        - name: CONTEXT
          value: $(params.context-path)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig

    # Task 4: Convert to QCOW2
    - name: convert-to-qcow2
      taskRef:
        name: bootc-image-builder
        kind: Task
      runAfter:
        - build-bootc-image
      params:
        - name: source-image
          value: "$(params.registry-url)/$(params.registry-namespace)/$(params.image-name):$(tasks.set-image-tag.results.tag)"
        - name: output-type
          value: "qcow2"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig

    # Task 5: Package QCOW2 for OCP-V
    - name: package-disk-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - convert-to-qcow2
      params:
        - name: IMAGE
          value: "$(params.registry-url)/$(params.registry-namespace)/$(params.image-name):$(tasks.set-image-tag.results.tag)-disk"
        - name: DOCKERFILE
          value: "demos/webserver/Containerfile.ocpv"
        # Context must be the workspace root, not demos/webserver: the
        # bootc-image-builder task writes its output to
        # $(workspaces.source.path)/output/qcow2/disk.qcow2, and this
        # Containerfile's ADD path ("output/qcow2/disk.qcow2") is resolved
        # relative to the build context.
        - name: CONTEXT
          value: "."
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig

    # Task 6: Deploy to OpenShift Virtualization
    - name: deploy-vm
      taskRef:
        name: oc-client
        kind: Task
      runAfter:
        - package-disk-image
      params:
        - name: SCRIPT
          value: |
            # Update DataVolume with new image
            export IMAGE_URL="docker://$(params.registry-url)/$(params.registry-namespace)/$(params.image-name):$(tasks.set-image-tag.results.tag)-disk"
            
            # Create namespace if not exists
            oc create namespace $(params.target-namespace) --dry-run=client -o yaml | oc apply -f -
            
            # DataVolume specs are immutable once created (CDI's admission
            # webhook rejects "Cannot update DataVolume Spec"), and every
            # run has a new image tag, so replace it instead of applying in
            # place. Its PVC stays in use as long as the VM is running, so
            # stop the VM first or PVC/DataVolume deletion hangs.
            oc delete vm $(params.image-name) -n $(params.target-namespace) --ignore-not-found --wait=true --timeout=120s
            oc delete datavolume $(params.image-name)-disk -n $(params.target-namespace) --ignore-not-found --wait=true --timeout=120s
            
            # Apply DataVolume
            cat <<EOF | oc apply -f -
            apiVersion: cdi.kubevirt.io/v1beta1
            kind: DataVolume
            metadata:
              name: $(params.image-name)-disk
              namespace: $(params.target-namespace)
            spec:
              source:
                registry:
                  url: "${IMAGE_URL}"
              pvc:
                # ReadWriteOnce + Filesystem binds fine but blocks live migration
                # ("PVC is not shared, live migration requires ReadWriteMany").
                # This cluster's block storage class only allows ReadWriteMany
                # when volumeMode is Block (confirmed: RWX+Filesystem is
                # rejected with "non-block volume with RWX access mode is not
                # supported"), so CDI must import straight onto a block device
                # instead of writing a disk.img file.
                accessModes:
                  - ReadWriteMany
                volumeMode: Block
                storageClassName: kubevirt-odf-replica-two-block
                resources:
                  requests:
                    storage: 20Gi
            EOF
            
            # Apply VM and networking
            oc apply -f openshift-virtualization/virtualmachine.yaml -n $(params.target-namespace)
            oc apply -f openshift-virtualization/service.yaml -n $(params.target-namespace)
            oc apply -f openshift-virtualization/route.yaml -n $(params.target-namespace)
            
            echo "Deployment initiated. Check VM status with: oc get vm -n $(params.target-namespace)"
      workspaces:
        - name: manifest_dir
          workspace: source
