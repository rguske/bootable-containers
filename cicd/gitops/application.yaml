---
# ArgoCD Application for Bootable Container VM deployment
# Automatically syncs VM configuration from Git

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootc-webserver
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: bootc-webserver
    app.kubernetes.io/part-of: bootable-containers
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/rguske/bootable-containers.git
    targetRevision: main
    path: openshift-virtualization
    
    # Use Kustomize for templating
    kustomize:
      # Override image tag dynamically
      images:
        - quay.io/rguske/bootc-webserver=quay.io/rguske/bootc-webserver:20260827-1505-disk
      # openshift-virtualization/kustomization.yaml hardcodes
      # `namespace: bootable-containers-demo` (used by the manual "Demo 3"
      # deployment in the top-level README). Without this override, that
      # value silently wins over destination.namespace below, so GitOps
      # would deploy into the same namespace as the manual demo instead of
      # its own bootable-containers-gitops (confirmed while testing this
      # override mechanism against a multi-env ApplicationSet). Setting
      # kustomize.namespace runs `kustomize edit set namespace` before
      # build, which overrides the base's namespace transform.
      namespace: bootable-containers-gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: bootable-containers-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health checks for VirtualMachine resources
  ignoreDifferences:
    - group: kubevirt.io
      kind: VirtualMachine
      jsonPointers:
        - /spec/template/spec/domain/resources
        - /status
